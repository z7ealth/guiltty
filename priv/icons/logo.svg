<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="guiltty">
  <!-- The app icon: guiltty-mark on guiltty-lockup-card's dark rounded
       square, in the card's lavender. A faint edge keeps it visible on
       dark panels. `make icons` turns this into every size. -->
