  <rect x="2.5" y="2.5" width="59" height="59" rx="12.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <g transform="translate(32 32) scale(0.8) translate(-32 -32)" fill="none" stroke="#9184d9"
     stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 18L8 46"/>
    <path d="M17 18L31 32L17 46"/>
    <path d="M42 46L56 46"/>
  </g>
</svg>
